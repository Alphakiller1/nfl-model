[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nfl-model"
version = "0.2.0"
description = "Opponent-adjusted NFL projections with an explicit promotion/authority gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.15.20"]

[project.scripts]
nfl-model = "nflmodel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nflmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Selected explicitly rather than inherited from ruff's defaults. The default set grows
# with each release, so an unpinned config turns CI red on a day nobody touched the code
# — which is exactly how this repo's first CI run failed. Matches wnba-edge-model.
[tool.ruff.lint]
select = ["E", "F", "W", "I"]
