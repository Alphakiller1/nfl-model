[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nfl-model"
version = "0.1.0"
description = "Market-anchored NFL forecasts with an explicit promotion/authority gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
nfl-model = "nflmodel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nflmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
