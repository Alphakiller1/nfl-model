name: deploy-pages

on:
  push:
    branches:
      - main
  schedule:
    # Regular-season refreshes are quota-aware: one exact DraftKings request
    # carries h2h, spread and total.  Extra noon-ET snapshots cover the three
    # NFL game days without spending credits year-round.
    - cron: "10 14 * 1,9-12 2"
    - cron: "10 16 * 1,9-12 0,1,4"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to build (blank = current)"
        required: false
      week:
        description: "Week to build (blank = first with an unplayed game)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # false, not true: a Pages deploy that is mid-publish must finish. Cancelling it
  # produces GitHub's "Deployment failed, try again later". Overlapping runs queue.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install model
        run: pip install .

      - name: Restore source snapshots and shadow ledger
        uses: actions/cache/restore@v5
        with:
          path: |
            data/cache
            data/runtime-cache
          key: nfl-runtime-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nfl-runtime-${{ runner.os }}-

      - name: Recover the shadow ledger from the published site
        # The Actions cache is evicted after seven idle days. Without this, a miss
        # restarts the ledger empty and the season's record silently disappears.
        run: |
          ledger=data/runtime-cache/prediction-ledger.json
          if [ ! -s "$ledger" ]; then
            mkdir -p data/runtime-cache
            if curl -fsSL "https://alphakiller1.github.io/nfl-model/ledger.json.gz" | gunzip > "$ledger.tmp"; then
              mv "$ledger.tmp" "$ledger"
              echo "Recovered ledger from Pages"
            else
              rm -f "$ledger.tmp"
              echo "::warning::No cached or published ledger; starting a new one"
            fi
          fi

      - name: Build static dashboard
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_BOOKMAKERS: draftkings
          NFL_MODEL_CACHE: ${{ github.workspace }}/data/cache
          NFL_LEDGER_PATH: ${{ github.workspace }}/data/runtime-cache/prediction-ledger.json
          NFL_REQUIRE_LIVE_ODDS: "1"
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: |
          python -m nflmodel.cli build-site \
            --out _site/index.html \
            ${{ github.event.inputs.season && format('--season {0}', github.event.inputs.season) || '' }} \
            ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}

      - name: Post-build smoke
        env:
          # Publish a visibly degraded row when one late-posting game is absent
          # instead of leaving the entire public board on an older commit.
          NFL_MIN_BOOK_COVERAGE: "0.90"
        run: |
          python scripts/smoke_site.py _site/index.html
          python scripts/verify_build.py _site/build.json
          python scripts/audit_consistency.py _site/board.json

      - name: Save source snapshots and shadow ledger
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/cache
            data/runtime-cache
          key: nfl-runtime-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
