name: deploy-pages

on:
  push:
    branches:
      - main
  schedule:
    # Tuesday 15:10 UTC — after the weekend's results have settled and the new
    # week's lines have opened, before the slate matters. Matches cfb-model.
    - cron: "10 15 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to build (blank = current)"
        required: false
      week:
        description: "Week to build (blank = first with an unplayed game)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # false, not true: a Pages deploy that is mid-publish must finish. Cancelling it
  # produces GitHub's "Deployment failed, try again later". Overlapping runs queue.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install model
        run: pip install .

      - name: Build static dashboard
        run: |
          python -m nflmodel.cli build-site \
            --out _site/index.html \
            ${{ github.event.inputs.season && format('--season {0}', github.event.inputs.season) || '' }} \
            ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}

      - name: Emit the JSON contract alongside the page
        # Published next to the dashboard so a consumer reads the same numbers the
        # page shows rather than scraping them back out of the HTML.
        run: |
          python -m nflmodel.cli export --out _site/board.json \
            ${{ github.event.inputs.season && format('--season {0}', github.event.inputs.season) || '' }} \
            ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}

      - name: Post-build smoke
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path

          html = Path('_site/index.html').read_text(encoding='utf-8')
          order = ['id="authority"', 'id="board"', 'id="ratings"', 'id="units"',
                   'id="divisions"', 'id="methodology"']
          at = [html.index(marker) for marker in order]
          assert at == sorted(at), 'sections out of order — gate must lead'
          for key in ('RESEARCH_ONLY', 'bd-card', '1-800-GAMBLER', 'not betting advice'):
              assert key in html, key
          # A research-only build must never publish a CARD whose action reads BET.
          # Matched on the rendered status element, not a bare ">BET<" — the
          # methodology copy legitimately contains the word while explaining it
          # can never happen.
          assert 'bd-status is-pos">BET<' not in html, \
              'BET action rendered under a research-only authority'
          # A page that renders but carries no games is a source failure wearing a
          # success. Fail here rather than publishing an empty board.
          assert html.count('class="bd-card"') > 0, 'dashboard published with no games'

          payload = json.loads(Path('_site/board.json').read_text(encoding='utf-8'))
          assert payload['may_bet'] is False
          assert payload['games'], 'export published with no games'
          print(f"OK: {len(html)//1024} KB page, {len(payload['games'])} games, "
                f"week {payload['week']} of {payload['season']}")
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
